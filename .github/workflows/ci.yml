name: Phase 1 CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Backend and frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.lock
      - name: Install backend dependencies
        working-directory: apps/backend
        run: python -m pip install -r requirements-dev.lock
      - name: Test backend
        working-directory: apps/backend
        run: |
          python -m ruff check .
          python -m mypy app
          python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build

  windows-package:
    name: Windows packaging smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Build NSIS installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipTests
      - name: Smoke installed desktop application
        shell: pwsh
        run: ./scripts/smoke-installed-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projectmind-windows-installer
          path: |
            apps/desktop/src-tauri/Cargo.lock
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/projectmind-sidecar-smoke-*/logs/*.log
            ${{ runner.temp }}/projectmind-installed-smoke-logs/*
          if-no-files-found: error
