<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="ProjectMind Engineering AI desktop project intelligence"
    />
    <title>ProjectMind Engineering AI</title>
    <style data-projectmind-native-shell>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI Variable", "Segoe UI", Arial, sans-serif;
        background: #1f1f1f;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .native-shell {
        display: flex;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        padding: 40px;
        color: #f5f5f5;
        text-align: center;
        background: #1f1f1f;
      }

      .native-shell__mark {
        display: grid;
        width: 64px;
        height: 64px;
        place-items: center;
        border-radius: 16px;
        color: #7cc4ff;
        background: #0d3b66;
        font-size: 28px;
        font-weight: 700;
      }

      .native-shell--error .native-shell__mark {
        color: #ff99a4;
        background: #4f1118;
      }

      .native-shell h1,
      .native-shell p {
        margin: 0;
      }

      .native-shell p {
        max-width: 680px;
        color: #c7c7c7;
        line-height: 1.5;
      }

      .native-shell__path {
        max-width: min(760px, 100%);
        color: #c7c7c7;
        overflow-wrap: anywhere;
      }

      .native-shell__actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .native-shell button {
        padding: 9px 18px;
        border: 1px solid #858585;
        border-radius: 6px;
        color: #fff;
        background: #333;
        cursor: pointer;
        font: inherit;
      }

      .native-shell button:first-child {
        border-color: #0f6cbd;
        background: #0f6cbd;
      }

      .native-shell button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      @media (prefers-color-scheme: light) {
        :root {
          background: #f5f5f5;
        }

        .native-shell {
          color: #242424;
          background: #f5f5f5;
        }

        .native-shell p,
        .native-shell__path {
          color: #616161;
        }

        .native-shell button {
          color: #242424;
          background: #fff;
        }

        .native-shell button:first-child {
          color: #fff;
          background: #0f6cbd;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main
        class="native-shell"
        data-projectmind-boot-shell
        data-projectmind-surface
        role="status"
        aria-live="polite"
      >
        <div class="native-shell__mark" aria-hidden="true">P</div>
        <h1>Starting ProjectMind</h1>
        <p>
          Preparing the secure local workspace. Your project database remains on
          this computer.
        </p>
      </main>
    </div>
    <noscript>
      ProjectMind requires the Microsoft Edge WebView2 JavaScript runtime.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
